<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon"  href="/icon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio of Misael Malchiram Timpolas - Full-Stack Developer specializing in React, Node.js, and modern web technologies." />
  <!-- <link href="/dist/main.css" rel="stylesheet" /> -->
  <!-- Google Font -->
  <link rel="preload" as="image" href="/src/assets/images/me.webp" />
  
  <title>PORTOFOLIO</title>
</head>

<body>
   <div id="initial-loader">
    <div class="loader-inner">
      <img src="/icon.webp" alt="logo" class="logo-img" />
      <div class="line"></div>
    </div>
  </div>

  <!-- 🔥 ROOT KHUSUS REACT -->
  <div id="root"></div>

<style>
  html, body,#root {
    margin: 0;
    padding: 0;
    background: #0f172a;
    scrollbar-width: none; /* Firefox */
 scroll-behavior: smooth;
  }
 .logo-img {
    width: 120px;
    height: 120px;
    border-radius: 9999px;
    outline: 2px solid #e7e5e4; /* stone-200 */
    outline-offset: 2px;
    object-fit: cover;
  }

  .logo-img:hover {
    outline-color: #d946ef; /* fuchsia-500 */
  }
  #initial-loader {
    position: fixed;
    inset: 0;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
     opacity: 1;
  transition: 
    transform 1.2s cubic-bezier(0.76, 0, 0.24, 1),
    opacity 0.6s ease;
    backdrop-filter: blur(0px);
  }

  .loader-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .logo {
    color: white;
    font-size: 22px;
    letter-spacing: 6px;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards;
  }

  .line {
    width: 400px;
    height: 5px;
    background: rgba(255,255,255,0.2);
    overflow: hidden;
    border-radius: 999px;
  }

  .line::after {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #a855f7, #ec4899, #ef4444);
    transform: translateX(-100%);
    animation: loading 2s infinite ease-in-out;
  }

  .logo-img {
  animation: float 2s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}

  @keyframes loading {
    0% { transform: translateX(-100%); }
    50% { transform: translateX(100%); }
    100% { transform: translateX(100%); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* EXIT ANIMATION */
  #initial-loader.hide {
  opacity: 0;
   backdrop-filter: blur(10px);
}
#initial-loader,
.loader-inner {
  will-change: transform, opacity;
}
  #initial-loader.hide .loader-inner {
    opacity: 0;
    transition: opacity 0.8s ease;
  }
</style>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
